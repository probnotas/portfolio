<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects | Armaan Sharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Jost:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  html, body { height: 100%; overflow: hidden; }

  /* ---------- Works wheel ---------- */
  .wheel { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .wheel__stage {
    position: absolute; inset: 0; cursor: grab; touch-action: none; outline: none;
  }
  .wheel__stage:active { cursor: grabbing; }
  .wheel__stage:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
  .wheel__drum { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
  .wheel__card { position: absolute; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .wheel__face {
    position: relative; display: block; width: 100%; height: 100%; overflow: hidden; border-radius: 8px;
    background: #e9e9ec; box-shadow: 0 18px 40px -18px rgba(15, 15, 21, .35);
  }
  .wheel__face img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .wheel__view {
    position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .82);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-size: 11px; font-weight: 500; color: var(--ink);
    opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s; pointer-events: none;
  }
  @media (any-hover: hover) { .wheel__card:hover .wheel__view { opacity: 1; transform: none; } }

  .wheel__label, .wheel__title {
    position: absolute; pointer-events: none; letter-spacing: -.02em; font-weight: 400; color: var(--ink);
  }
  .wheel__label { inset: 0; display: grid; place-items: center; }
  .wheel__title { top: 50%; left: 8%; transform: translateY(-50%); opacity: 0; max-width: 24%; line-height: 1.05; }
  .wheel__name { display: block; }
  .wheel__desc { margin-top: .9em; font-size: clamp(12px, .95vw, 15px); line-height: 1.5; letter-spacing: 0; color: var(--mute-2); max-width: 30ch; }

  .wheel__index {
    position: absolute; top: 7.5%; right: 2.5%; margin: 0; padding: 0; list-style: none;
    text-align: right; line-height: 1.75; color: var(--mute);
  }
  .wheel__index button { font: inherit; color: inherit; transition: color .2s; }
  .wheel__index button:hover, .wheel__index button[aria-current="true"] { color: var(--ink); }
  .wheel__index button[aria-current="true"] { font-weight: 500; }

  .wheel__hint {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--mute);
    transition: opacity .4s; pointer-events: none;
  }
  @media (max-width: 720px) {
    .wheel__title { left: 6%; right: 6%; max-width: none; top: auto; bottom: 8%; transform: none; }
    .wheel__index { display: none; }
  }
</style>
</head>
<body>

<header class="header">
  <a class="label roll" href="https://embodiedpredictiveintelligence.vercel.app" target="_blank" rel="noopener"><span data-t="Research">Research</span></a>
  <a class="header__center" href="index.html">Armaan Sharma</a>
  <a class="label roll header__right" href="index.html#contact"><span data-t="Contact">Contact</span></a>
</header>

<main class="wheel" aria-label="Projects">
  <div class="wheel__stage" tabindex="0" role="listbox" aria-label="Projects">
    <div class="wheel__drum"></div>
  </div>
  <div class="wheel__label">Projects '26</div>
  <div class="wheel__title" aria-live="polite"><span class="wheel__name"></span><p class="wheel__desc"></p></div>
  <ol class="wheel__index"></ol>
  <p class="wheel__hint">Scroll, drag or use the arrow keys</p>
</main>

<script>
  /* ================= Works wheel =================
     A plain-JavaScript port of the "works wheel" component.
     At rest the projects sit in a ring around the title, each card tangent to the circle. The first
     turn blows the ring open into a vertical drum: the front card lies flat and full size, the ones
     above and below rotate away into hard perspective. Keep turning and the drum carries the next
     project round to the front. Everything is driven by one number, `turn`: 0 is the ring, 1 is the
     drum with project 0 at the front, and each whole number after that is one more project turned past. */

  // Projects on the wheel, most important first (from github.com/probnotas).
  // `href` is where clicking the front card goes (opens in a new tab); `desc` shows under the title.
  const GH = "https://github.com/probnotas/";
  const PROJECTS = [
    { title: "Self-Model Research", image: "images/epi.jpg", href: GH + "self-model-research",
      desc: "Robots that learn a predictive model of their own body from a handful of real trials. Four rungs of experiments so far, published even when they're bad." },
    { title: "repro-agent", image: "images/cover-repro.svg", href: GH + "repro-agent",
      desc: "Give it an arXiv link and it reruns the paper's headline claim, then hands back a report card on whether it actually reproduces." },
    { title: "Lumos", image: "images/proj-lumos.jpg", href: "https://trylumos.vercel.app",
      desc: "A sleep moonshot: three people with AI backgrounds building a real tool for the 852 million people who don't sleep well." },
    { title: "PiClaw", image: "images/piclaw.svg", href: GH + "PiClaw",
      desc: "Canada's first lightweight OpenClaw model, built so non-technical users aged 45–70 can set it up on any hardware with 32MB of RAM." },
    { title: "The Agentic Network", image: "images/agentic-network.jpg", href: "https://theagenticnetwork.vercel.app",
      desc: "An open-source civilization where AI agents and humans coexist: agents form communities, debate ideas, ship code, and tell their own stories." },
    { title: "JARVIS", image: "images/proj-jarvis.jpg", href: GH + "ultimatejarvis",
      desc: "A proactive, witty, efficient assistant inspired by J.A.R.V.I.S. that manages your tasks and information, not just a chatbot." },
    { title: "Cattle Movement Predictor", image: "images/proj-cattle.jpg", href: GH + "southsudancattlemovementpredictor",
      desc: "Three ML models using NDVI and NDWI to find South Sudan's cattle camps, map 30 months of movement, and predict where herds go in the next 2–4 weeks." },
    { title: "HireMeUnconventional", image: "images/cover-hireme.svg", href: GH + "hiremeunconventional",
      desc: "An unconventional hiring strategy that shows up when CEOs like Jensen Huang and Mark Zuckerberg search their own names." },
    { title: "Magic Hour UGC", image: "images/proj-magic-hour.jpg", href: GH + "magic-hour-ugc",
      desc: "Open-sourced AI UGC automation for Magic Hour (YC W24): plug in an API key and the content pipeline runs end to end." },
  ];

  /* Geometry. The card is measured against the stage; everything else against the card. */
  const CARD_H = .38, CARD_MAX_W = .34, CARD_RATIO = 1.45;  // card height of stage; max width of stage; width / height
  const STEP = 40;      // degrees between cards on the drum
  const DRUM = 2.22;    // drum radius, in card heights
  const LENS = 2.7;     // perspective distance, in card heights
  const RING_R = 1.14;  // ring radius, in card heights
  const BOW = 1.82;     // radius of the sideways arc the drum curves along (centre off to the left)
  const TITLE = .124, INDEX = .04;  // type sizes, in card heights
  const CULL = 1.6;     // cards further than this from the front aren't drawn
  const WHEEL_UNITS = 900, DRAG_UNITS = 420; // wheel delta / dragged px per project
  const SETTLE = 140;   // ms after the last wheel event before snapping onto a project
  const EASE = .12;     // fraction of the remaining distance closed each frame

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rad = d => d * Math.PI / 180;
  const bowAt = (drumDeg, bow) => -bow * (1 - Math.cos(rad(drumDeg)));
  function place(ringDeg, drumDeg, ringR, drumR, bow, m) {
    return `translateX(${m * bowAt(drumDeg, bow)}px)` +
      ` rotateZ(${(1 - m) * ringDeg}deg) translateY(${-(1 - m) * ringR}px)` +
      ` rotateX(${m * drumDeg}deg) translateZ(${m * drumR}px)`;
  }

  const stage = document.querySelector(".wheel__stage");
  const drum = document.querySelector(".wheel__drum");
  const labelEl = document.querySelector(".wheel__label");
  const titleEl = document.querySelector(".wheel__title");
  const nameEl = titleEl.querySelector(".wheel__name"), descEl = titleEl.querySelector(".wheel__desc");
  const indexEl = document.querySelector(".wheel__index");
  const hintEl = document.querySelector(".wheel__hint");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const count = PROJECTS.length, last = Math.max(count - 1, 0);

  // cards
  const cards = PROJECTS.map((p, i) => {
    const el = document.createElement(p.href ? "a" : "div");
    el.className = "wheel__card";
    el.id = `works-wheel-${i}`;
    el.setAttribute("role", "option");
    if (p.href) { el.href = p.href; el.target = "_blank"; el.rel = "noopener"; el.draggable = false; }
    el.innerHTML = `<span class="wheel__face"><img src="${p.image}" alt="${p.title}" draggable="false">${p.href ?
      `<span class="wheel__view"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M3 9 9 3M4 3h5v5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>View</span>` : ""}</span>`;
    drum.appendChild(el);
    return el;
  });
  // index down the right-hand side
  indexEl.innerHTML = PROJECTS.map((p, i) => `<li><button type="button" data-i="${i}">${p.title}</button></li>`).join("");
  const indexBtns = [...indexEl.querySelectorAll("button")];
  indexBtns.forEach(b => b.addEventListener("click", () => to(+b.dataset.i + 1)));

  // sizing, measured against the stage
  let M = {};
  function measure() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const cardW = Math.min(h * CARD_H * CARD_RATIO, w * CARD_MAX_W);
    const cardH = cardW / CARD_RATIO;
    const ringR = cardH * RING_R;
    // shrink the ring's cards until the circle reads as a closed loop
    const ringScale = count ? clamp((2 * Math.PI * ringR / count) * .82 / (cardW || 1), .16, 1) : 1;
    M = { cardW, cardH, ringR, ringScale, drumR: cardH * DRUM, bow: cardH * BOW, depth: cardH * LENS };
    stage.style.perspective = `${M.depth}px`;
    labelEl.style.fontSize = nameEl.style.fontSize = `${cardH * TITLE}px`;
    indexEl.style.fontSize = `${Math.max(12, cardH * INDEX)}px`;
    cards.forEach(c => {
      c.style.width = `${cardW}px`; c.style.height = `${cardH}px`;
      c.style.marginLeft = `${-cardW / 2}px`; c.style.marginTop = `${-cardH / 2}px`;
    });
  }
  measure();
  new ResizeObserver(measure).observe(stage);

  // the wheel's position, and where it's heading
  let turn = 0, target = 0, active = -1, settling = 0;
  const to = next => { target = clamp(next, 0, last + 1); };

  function draw() {
    requestAnimationFrame(draw);
    const gap = target - turn;
    turn = Math.abs(gap) < .0005 ? target : turn + gap * (reduced ? 1 : EASE);
    const m = clamp(turn, 0, 1), pos = Math.max(0, turn - 1);
    // pull the drum back so its front face lands on the picture plane
    drum.style.transform = `translateZ(${-m * M.drumR}px)`;
    for (let i = 0; i < count; i++) {
      const d = i - pos, card = cards[i];
      card.style.transform = place(d * (360 / count), d * STEP, M.ringR, M.drumR, M.bow, m);
      card.style.opacity = m > .5 && Math.abs(d) > CULL ? "0" : "1";
      card.style.zIndex = String(Math.round(100 - Math.abs(d) * 2));
      card.firstElementChild.style.transform = `scale(${lerp(M.ringScale, 1, m)})`;
    }
    labelEl.style.opacity = String(1 - m);
    titleEl.style.opacity = String(m);
    hintEl.style.opacity = String(1 - m);
    const near = clamp(Math.round(pos), 0, last);
    if (near !== active) {
      active = near;
      nameEl.textContent = PROJECTS[active].title;
      descEl.textContent = PROJECTS[active].desc || "";
      stage.setAttribute("aria-activedescendant", `works-wheel-${active}`);
      cards.forEach((c, i) => c.setAttribute("aria-selected", String(i === active)));
      indexBtns.forEach((b, i) => b.setAttribute("aria-current", String(i === active)));
    }
  }
  requestAnimationFrame(draw);

  // scroll wheel: turn, then settle onto the nearest project
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    to(target + e.deltaY / WHEEL_UNITS);
    clearTimeout(settling);
    settling = setTimeout(() => to(Math.round(target)), SETTLE);
  }, { passive: false });

  // drag: up/down turns the wheel; a click without a drag still follows the card's link
  let dragY = null, dragged = 0;
  stage.addEventListener("pointerdown", e => { dragY = e.clientY; dragged = 0; });
  addEventListener("pointermove", e => {
    if (dragY === null) return;
    dragged += Math.abs(dragY - e.clientY);
    to(target + (dragY - e.clientY) / DRAG_UNITS);
    dragY = e.clientY;
  });
  addEventListener("pointerup", () => {
    if (dragY === null) return;
    dragY = null;
    if (target > 1) to(Math.round(target));
  });
  stage.addEventListener("click", e => { if (dragged > 6) e.preventDefault(); }, true);

  // keyboard
  stage.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowRight") to(Math.round(target) + 1);
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") to(Math.round(target) - 1);
    else return;
    e.preventDefault();
  });
  stage.focus({ preventScroll: true });
</script>
</body>
</html>
