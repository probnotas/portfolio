<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive | Armaan Sharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Jost:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  body { background: var(--paper-2); }
  body[data-view="board"] { overflow: hidden; }
  .view { display: none; }
  body[data-view="board"] .view--board,
  body[data-view="stack"] .view--stack,
  body[data-view="grid"] .view--grid { display: block; }

  .fade-in { animation: fade .7s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* ---------- View switcher pill ---------- */
  .switch {
    position: fixed; left: 50%; bottom: 18px; z-index: 60; transform: translateX(-50%);
    display: flex; padding: 4px; border-radius: 999px;
    background: rgba(255, 255, 255, .78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 6px 24px rgba(15, 15, 21, .08);
  }
  .switch__ind {
    position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--ink);
    transition: transform .45s cubic-bezier(.7, 0, .2, 1), width .45s cubic-bezier(.7, 0, .2, 1);
  }
  .switch button {
    position: relative; z-index: 1; padding: 7px 16px; min-width: 66px;
    font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 15px;
    color: var(--mute-2); transition: color .35s;
  }
  .switch button[aria-pressed="true"] { color: #f8f8fb; }

  /* ---------- Grid ---------- */
  .view--grid { padding: 58px 12px 110px; }
  .filters { display: flex; gap: 18px; padding: 4px 4px 18px; flex-wrap: wrap; }
  .filters button { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); transition: color .25s; }
  .filters button sup { font-size: 8px; margin-left: 2px; font-weight: 500; }
  .filters button[aria-pressed="true"], .filters button:hover { color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card { position: relative; display: block; aspect-ratio: 4 / 5; overflow: hidden; cursor: pointer; }
  .card__art { position: absolute; inset: 0; transition: transform 1s cubic-bezier(.2, .8, .2, 1); }
  .card__cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 12px 12px; color: #fff;
    background: linear-gradient(transparent, rgba(0, 0, 0, .45));
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    opacity: 0; transition: opacity .35s;
  }
  @media (any-hover: hover) {
    .card:hover .card__art { transform: scale(1.04); }
    .card:hover .card__cap { opacity: 1; }
  }
  @media (any-hover: none) { .card__cap { opacity: 1; } }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }

  /* ---------- Stack ---------- */
  .stack { width: clamp(120px, 14vw, 210px); margin: 0 auto; padding: 50vh 0; display: flex; flex-direction: column; gap: 18px; }
  .stack__item { display: block; cursor: pointer; opacity: .5; transition: opacity .4s; }
  .stack__item.active { opacity: 1; }
  .stack__item div { width: 100%; }
  .preview {
    position: fixed; z-index: 5; top: 50%; left: 62vw; width: min(26vw, 380px);
    transform: translateY(-50%); pointer-events: none;
  }
  .preview__art { width: 100%; transition: opacity .35s; }
  .meta {
    position: fixed; z-index: 5; left: 16px; bottom: 84px; width: min(28vw, 340px);
  }
  .meta__kicker { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute-2); }
  .meta__title { font-family: var(--name); font-weight: 500; font-size: clamp(22px, 2.2vw, 32px); line-height: 1.08; margin: 8px 0 12px; }
  .meta__text { font-size: 13px; line-height: 1.5; color: #3a3a44; }
  .meta__open { margin-top: 16px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid currentColor; }
  .meta > * { transition: opacity .3s; }
  .meta.swap > * { opacity: 0; }
  @media (max-width: 720px) {
    .stack { width: 46vw; }
    .preview { display: none; }
    .meta { left: 16px; right: 16px; width: auto; bottom: 74px; background: rgba(242, 242, 242, .9); padding: 12px 0 6px; }
    .meta__text { display: none; }
  }

  /* ---------- Board ---------- */
  .view--board { position: fixed; inset: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .view--board.dragging { cursor: grabbing; }
  .bt { position: absolute; left: 0; top: 0; padding: 1px; will-change: transform; }
  .bt__art { width: 100%; height: 100%; }
  .bt__cap {
    position: absolute; left: 12px; bottom: 10px; color: #fff; pointer-events: none;
    font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    opacity: 0; transition: opacity .3s; text-shadow: 0 1px 8px rgba(0, 0, 0, .35);
  }
  @media (any-hover: hover) { .view--board:not(.dragging) .bt:hover .bt__cap { opacity: 1; } }
  .zoom {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%); z-index: 60;
    display: flex; flex-direction: column; border-radius: 999px; padding: 4px;
    background: rgba(255, 255, 255, .78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 6px 24px rgba(15, 15, 21, .08);
  }
  .zoom button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--mute-2); font-size: 18px; font-weight: 400; transition: color .2s; }
  .zoom button:hover { color: var(--ink); }
  body:not([data-view="board"]) .zoom { display: none; }
</style>
</head>
<body data-view="board">

<header class="header">
  <a class="label roll" href="https://embodiedpredictiveintelligence.vercel.app" target="_blank" rel="noopener"><span data-t="Research">Research</span></a>
  <a class="header__center" href="index.html">Armaan Sharma</a>
  <a class="label roll header__right" href="index.html#contact"><span data-t="Contact">Contact</span></a>
</header>

<section class="view view--board" aria-label="Board"></section>
<div class="zoom" aria-label="Zoom">
  <button type="button" data-zoom="1" aria-label="Zoom in">+</button>
  <button type="button" data-zoom="-1" aria-label="Zoom out">−</button>
</div>

<section class="view view--stack" aria-label="Stack">
  <div class="stack"></div>
  <div class="preview" aria-hidden="true"><div class="preview__art"></div></div>
  <div class="meta">
    <p class="meta__kicker"></p>
    <h2 class="meta__title"></h2>
    <p class="meta__text"></p>
    <button class="meta__open roll" type="button"><span data-t="Open project">Open project</span></button>
  </div>
</section>

<section class="view view--grid" aria-label="Grid">
  <div class="filters" role="group" aria-label="Filter by category"></div>
  <div class="grid"></div>
</section>

<nav class="switch" aria-label="View">
  <span class="switch__ind"></span>
  <button type="button" data-view="board">Board</button>
  <button type="button" data-view="stack">Stack</button>
  <button type="button" data-view="grid">Grid</button>
</nav>

<script src="data.js"></script>
<script>
  const body = document.body;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= View switching ================= */
  const switchBtns = [...document.querySelectorAll(".switch button")];
  const ind = document.querySelector(".switch__ind");
  function setView(v, push = true) {
    body.dataset.view = v;
    switchBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
    const b = switchBtns.find(b => b.dataset.view === v);
    ind.style.width = b.offsetWidth + "px";
    ind.style.transform = `translateX(${b.offsetLeft}px)`;
    if (push) history.replaceState(null, "", "?view=" + v);
    scrollTo(0, 0);
    if (v === "board") board.start(); else board.stop();
    if (v === "stack") stack.update(true);
    document.querySelectorAll(`.view--${v} .card, .view--${v} .stack__item`).forEach((el, i) => {
      el.classList.remove("fade-in"); void el.offsetWidth;
      el.style.animationDelay = Math.min(i, 16) * 40 + "ms"; el.classList.add("fade-in");
    });
  }
  switchBtns.forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));

  /* ================= Grid ================= */
  const grid = document.querySelector(".grid");
  const filters = document.querySelector(".filters");
  const cats = ["All", ...CATEGORIES];
  filters.innerHTML = cats.map(c => {
    const n = c === "All" ? WORKS.length : WORKS.filter(w => w.cat === c).length;
    return `<button type="button" data-cat="${c}" aria-pressed="${c === "All"}">${c}<sup>(${n})</sup></button>`;
  }).join("");
  function renderGrid(cat) {
    const list = cat === "All" ? WORKS : WORKS.filter(w => w.cat === cat);
    grid.innerHTML = list.map(w => `
      <a class="card fade-in" href="#${w.id}" data-id="${w.id}">
        <div class="card__art" style="${artStyle(w, WORKS.indexOf(w))}"></div>
        <p class="card__cap"><span>${w.title}</span><span>${w.year}</span></p>
      </a>`).join("");
    [...grid.children].forEach((el, i) => el.style.animationDelay = i * 40 + "ms");
  }
  filters.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderGrid(b.dataset.cat);
  });
  grid.addEventListener("click", e => {
    const c = e.target.closest(".card"); if (!c) return;
    e.preventDefault(); openProject(WORKS.find(w => w.id === c.dataset.id));
  });
  renderGrid("All");

  /* ================= Stack ================= */
  const stackEl = document.querySelector(".stack");
  stackEl.innerHTML = WORKS.map((w, i) => `
    <a class="stack__item" href="#${w.id}" data-i="${i}">
      <div style="${artStyle(w, i)};aspect-ratio:1/${w.ratio}"></div>
    </a>`).join("");
  const stackItems = [...stackEl.children];
  const previewArt = document.querySelector(".preview__art");
  const meta = document.querySelector(".meta");
  const stack = {
    active: -1,
    update(force) {
      const mid = innerHeight / 2;
      let best = 0, bestD = Infinity;
      stackItems.forEach((el, i) => {
        const r = el.getBoundingClientRect();
        const d = Math.abs(r.top + r.height / 2 - mid);
        if (d < bestD) { bestD = d; best = i; }
      });
      if (best === this.active && !force) return;
      this.active = best;
      stackItems.forEach((el, i) => el.classList.toggle("active", i === best));
      const w = WORKS[best];
      previewArt.style.cssText = artStyle(w, best) + `;aspect-ratio:1/${w.ratio}`;
      meta.classList.add("swap");
      setTimeout(() => {
        meta.querySelector(".meta__kicker").textContent = `${String(best + 1).padStart(2, "0")} / ${w.cat} · ${w.year}`;
        meta.querySelector(".meta__title").textContent = w.title;
        meta.querySelector(".meta__text").textContent = w.text;
        meta.classList.remove("swap");
      }, force ? 0 : 160);
    }
  };
  addEventListener("scroll", () => { if (body.dataset.view === "stack") stack.update(); }, { passive: true });
  stackEl.addEventListener("click", e => {
    const it = e.target.closest(".stack__item"); if (!it) return;
    e.preventDefault();
    const i = +it.dataset.i;
    if (i === stack.active) openProject(WORKS[i]);
    else it.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" });
  });
  document.querySelector(".meta__open").addEventListener("click", () => openProject(WORKS[stack.active]));

  /* ================= Board (infinite, draggable, zoomable) ================= */
  const boardEl = document.querySelector(".view--board");
  const board = (() => {
    let ox = 0, oy = 0, vx = 0, vy = 0;
    let zoom = 1, zoomTarget = 1;
    let tiles = [], nx = 0, ny = 0, TW = 0, TH = 0;
    let raf = 0, dragging = false, moved = 0, last = null;
    const N = WORKS.length;
    const mod = (a, b) => ((a % b) + b) % b;
    const baseW = () => Math.max(170, innerWidth * (innerWidth < 720 ? .44 : .19));

    function build() {
      TW = baseW() * zoom; TH = TW * 1.25;
      const needX = Math.ceil(innerWidth / TW) + 2, needY = Math.ceil(innerHeight / TH) + 2;
      if (needX === nx && needY === ny) return;
      nx = needX; ny = needY;
      boardEl.innerHTML = "";
      tiles = [];
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        const t = document.createElement("div");
        t.className = "bt";
        t.innerHTML = `<div class="bt__art"></div><p class="bt__cap"></p>`;
        t._i = i; t._j = j; t._idx = -1;
        boardEl.appendChild(t); tiles.push(t);
      }
    }

    function render() {
      TW = baseW() * zoom; TH = TW * 1.25;
      const sx = mod(ox, TW), sy = mod(oy, TH);
      const c0 = Math.floor(ox / TW), r0 = Math.floor(oy / TH);
      for (const t of tiles) {
        const x = (t._i - 1) * TW + sx, y = (t._j - 1) * TH + sy;
        const col = t._i - 1 - c0, row = t._j - 1 - r0;
        const idx = mod(col + row * 5, N);   // shift each row so the pattern doesn't stack into columns
        if (idx !== t._idx) {
          t._idx = idx;
          const w = WORKS[idx];
          t.firstChild.style.cssText = artStyle(w, idx);
          t.lastChild.textContent = w.title;
        }
        t.style.width = TW + "px"; t.style.height = TH + "px";
        t.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      }
    }

    function loop() {
      if (!dragging) {
        ox += vx; oy += vy; vx *= .93; vy *= .93;
        if (Math.abs(vx) < .05) vx = 0; if (Math.abs(vy) < .05) vy = 0;
      }
      if (Math.abs(zoomTarget - zoom) > .001) {
        // zoom around the screen centre
        const cx = innerWidth / 2, cy = innerHeight / 2;
        const next = zoom + (zoomTarget - zoom) * .18;
        ox = cx - (cx - ox) * next / zoom; oy = cy - (cy - oy) * next / zoom;
        zoom = next; nx = ny = 0; build();
      }
      render();
      raf = requestAnimationFrame(loop);
    }

    boardEl.addEventListener("pointerdown", e => {
      dragging = true; moved = 0; vx = vy = 0; last = { x: e.clientX, y: e.clientY };
      boardEl.setPointerCapture(e.pointerId);
    });
    boardEl.addEventListener("pointermove", e => {
      if (!dragging) return;
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 4) boardEl.classList.add("dragging");
      ox += dx; oy += dy; vx = dx; vy = dy; last = { x: e.clientX, y: e.clientY };
    });
    const end = e => {
      if (!dragging) return;
      dragging = false; boardEl.classList.remove("dragging");
      if (moved <= 4) {
        const t = document.elementFromPoint(e.clientX, e.clientY)?.closest(".bt");
        if (t) openProject(WORKS[t._idx]);
        vx = vy = 0;
      }
    };
    boardEl.addEventListener("pointerup", end);
    boardEl.addEventListener("pointercancel", end);
    boardEl.addEventListener("wheel", e => {
      e.preventDefault();
      if (e.ctrlKey) { zoomTarget = Math.min(1.8, Math.max(.55, zoomTarget * (1 - e.deltaY * .01))); return; }
      ox -= e.deltaX; oy -= e.deltaY; vx = vy = 0;
    }, { passive: false });
    document.querySelectorAll("[data-zoom]").forEach(b => b.addEventListener("click", () => {
      zoomTarget = Math.min(1.8, Math.max(.55, zoomTarget * (b.dataset.zoom > 0 ? 1.25 : .8)));
    }));
    addEventListener("keydown", e => {
      if (body.dataset.view !== "board" || document.querySelector(".lightbox.open")) return;
      const k = { ArrowLeft: [40, 0], ArrowRight: [-40, 0], ArrowUp: [0, 40], ArrowDown: [0, -40] }[e.key];
      if (k) { vx = k[0] / 4; vy = k[1] / 4; }
    });
    addEventListener("resize", () => { nx = ny = 0; build(); });

    return {
      start() {
        build();
        if (!raf) {
          ox = innerWidth / 2 - TW * 1.5; oy = innerHeight / 2 - TH * 1.5;
          raf = requestAnimationFrame(loop);
          boardEl.classList.remove("fade-in"); void boardEl.offsetWidth; boardEl.classList.add("fade-in");
        }
      },
      stop() { cancelAnimationFrame(raf); raf = 0; }
    };
  })();

  /* ================= Init ================= */
  const initial = new URLSearchParams(location.search).get("view");
  document.fonts.ready.then(() => setView(["board", "stack", "grid"].includes(initial) ? initial : "board", false));
</script>
</body>
</html>
